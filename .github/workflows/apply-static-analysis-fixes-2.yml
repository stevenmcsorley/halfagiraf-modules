name: Apply static analysis fixes 2
on:
  push:
    branches: [fix/static-analysis-issue-1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/static-analysis-issue-1
      - name: Patch sources
        run: echo '' | base64 -d > /tmp/fix.py && python3 /tmp/fix.py
      - name: Validate
        run: |
          git diff --check
          mkdir -p build/tests
          for source in tests/*.cpp; do
            name="$(basename "$source" .cpp)"
            g++ -std=c++11 -O2 -Wall -Wextra -pedantic "$source" -o "build/tests/$name"
            "build/tests/$name"
          done
      - name: Commit
        run: |
          rm .github/workflows/apply-static-analysis-fixes.yml .github/workflows/apply-static-analysis-fixes-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Entwine.cpp src/ConstellateEngine.hpp src/PalimpsestEngine.hpp .github/workflows/apply-static-analysis-fixes.yml .github/workflows/apply-static-analysis-fixes-2.yml
          git commit -m "Fix static analysis findings"
          git push origin HEAD:fix/static-analysis-issue-1
