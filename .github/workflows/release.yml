name: Build and release

on:
  push:
    branches:
      - main
      - feature/grainloom-beads-port
      - feature/sonavyre
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: "2.6.6"

jobs:
  engine-tests:
    name: Deterministic engine tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Compile and run tests
        run: |
          mkdir -p build/tests
          for source in tests/*.cpp; do
            name="$(basename "$source" .cpp)"
            g++ -std=c++11 -O2 -Wall -Wextra -pedantic "$source" -o "build/tests/$name"
            "build/tests/$name"
          done
      - name: Beads reference and adapter tests
        run: make -f grainloom.mk grainloom-pristine-test grainloom-upstream-test
      - name: Grainloom pitch, concurrency and long-running stress
        run: make -f grainloom.mk grainloom-stress-test
      - name: Recording display format and read-only checks
        run: make -f grainloom.mk grainloom-display-test
      - name: Grainloom address and undefined-behaviour checks
        run: make -f grainloom.mk grainloom-sanitize-test

  build-unix:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: lin-x64
          - runner: macos-15
            platform: mac-arm64
          - runner: macos-15-intel
            platform: mac-x64
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential jq zstd unzip libjack-jackd2-0 libpulse0
      - name: Install build dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install jq zstd
      - name: Download Rack SDK
        run: |
          curl -fsSL -o rack-sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.platform }}.zip"
          unzip -q rack-sdk.zip
      - name: Verify native Beads adapter
        run: make -f grainloom.mk grainloom-test grainloom-display-test
      - name: Build platform package
        run: make -j"$(getconf _NPROCESSORS_ONLN)" RACK_DIR="$PWD/Rack-SDK" dist
      - name: Package separate paid editions (excluded from family release)
        run: |
          make -C products/sonavyre-studio -j2 RACK_DIR="$PWD/Rack-SDK" dist
          make -C products/sonavyre-pro -j2 RACK_DIR="$PWD/Rack-SDK" dist
      - name: SONAVYRE preset and edition regression
        if: runner.os == 'Linux'
        run: |
          RACK_DIR="$PWD/Rack-SDK" tools/test_sonavyre.sh --self-contained
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error

      - name: Upload paid-edition test packages
        uses: actions/upload-artifact@v7
        with:
          name: sonavyre-paid-${{ matrix.platform }}
          path: products/sonavyre-*/dist/*.vcvplugin
          if-no-files-found: error

  build-windows:
    name: win-x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make tar unzip curl diffutils python
            mingw-w64-x86_64-gcc
            jq
            mingw-w64-x86_64-zstd
      - name: Download Rack SDK
        run: |
          curl -fsSL -o rack-sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-win-x64.zip"
          unzip -q rack-sdk.zip
      - name: Verify native Beads adapter
        run: make -f grainloom.mk grainloom-test grainloom-display-test
      - name: Build platform package
        run: make -j"$(nproc)" RACK_DIR="$PWD/Rack-SDK" dist
      - name: Package separate paid editions (excluded from family release)
        run: |
          make -C products/sonavyre-studio -j2 RACK_DIR="$PWD/Rack-SDK" dist
          make -C products/sonavyre-pro -j2 RACK_DIR="$PWD/Rack-SDK" dist
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: dist/*.vcvplugin
          if-no-files-found: error

      - name: Upload paid-edition test packages
        uses: actions/upload-artifact@v7
        with:
          name: sonavyre-paid-win-x64
          path: products/sonavyre-*/dist/*.vcvplugin
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-tests, build-unix, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t packages < <(find artifacts -type f -name 'halfagiraf-*.vcvplugin' ! -name 'halfagiraf-sonavyre-*' -print | sort)
          test "${#packages[@]}" -eq 4
          gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "halfagiraf Modules ${GITHUB_REF_NAME#v}" \
            --generate-notes
