<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="81.28mm" height="128.5mm" viewBox="0 0 81.28 128.5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141519"/>
      <stop offset="0.5" stop-color="#0d0e12"/>
      <stop offset="1" stop-color="#111217"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6a532" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6a532" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e6a532" stop-opacity="0"/>
    </linearGradient>
    <!-- nebula clouds around Coupling: warm pink to the left, cool cyan to the right -->
    <radialGradient id="cPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7a6c8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#c87ab4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7a4a86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cMag" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e58ad0" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#9a5aa8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5a3a70" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfeef6" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#7ec8dc" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3f7a96" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cWhite" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#c8d6e6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7a8aa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8e8" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#9fd8e8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9fd8e8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .maker{ fill:#8c93a1; font-family:'DejaVu Sans','Arial',sans-serif; font-size:1.45px; font-weight:600; letter-spacing:0.8px; text-anchor:middle; }
      .name { fill:#f3f4f7; font-family:'DejaVu Sans','Arial',sans-serif; font-size:5.4px; font-weight:700; letter-spacing:1.0px; text-anchor:middle; }
      .tag  { fill:#e6a532; font-family:'DejaVu Sans','Arial',sans-serif; font-size:1.45px; font-weight:600; letter-spacing:0.55px; text-anchor:middle; }
      .lbl  { fill:#f0f3f7; font-family:'DejaVu Sans','Arial',sans-serif; font-size:2.5px; font-weight:700; text-anchor:middle; letter-spacing:0.2px; }
      .sml  { fill:#c6ccd6; font-family:'DejaVu Sans','Arial',sans-serif; font-size:1.9px; font-weight:600; text-anchor:middle; }
      .acc  { fill:#e6a532; }
      .brand{ fill:#8c93a1; font-family:'DejaVu Sans','Arial',sans-serif; font-size:2.2px; font-weight:700; letter-spacing:1.4px; text-anchor:start; }
    </style>
  </defs>

  <rect width="81.28" height="128.5" fill="url(#bg)"/>
  <rect x="0.6" y="0.6" width="80.08" height="127.3" fill="none" stroke="#2b2e36" stroke-width="0.4"/>

  <!-- ── nebula band behind the Coupling knob ── -->
  <g>
    <rect x="2" y="58" width="77.28" height="30" fill="url(#mist)"/>
    <!-- left: pink / magenta plumes -->
    <ellipse cx="17" cy="70" rx="13" ry="8.5" fill="url(#cPink)"/>
    <ellipse cx="24" cy="65.5" rx="8" ry="5" fill="url(#cMag)"/>
    <ellipse cx="11" cy="75" rx="9.5" ry="5.5" fill="url(#cMag)"/>
    <ellipse cx="27" cy="76" rx="7" ry="4" fill="url(#cPink)"/>
    <ellipse cx="20" cy="79.5" rx="11" ry="4" fill="url(#cWhite)"/>
    <ellipse cx="8" cy="68" rx="5.5" ry="3.2" fill="url(#cWhite)"/>
    <!-- right: magenta rising into cyan -->
    <ellipse cx="62" cy="64" rx="9" ry="5.5" fill="url(#cMag)"/>
    <ellipse cx="69" cy="62.5" rx="6" ry="3.4" fill="url(#cPink)"/>
    <ellipse cx="64" cy="73" rx="13" ry="8.5" fill="url(#cCyan)"/>
    <ellipse cx="73" cy="77" rx="8.5" ry="5" fill="url(#cCyan)"/>
    <ellipse cx="56" cy="78" rx="8" ry="4.2" fill="url(#cWhite)"/>
    <ellipse cx="70" cy="70" rx="6" ry="3.4" fill="url(#cWhite)"/>
    <!-- a low mist that ties the two sides together under the knob -->
    <ellipse cx="40.64" cy="82" rx="30" ry="3.2" fill="url(#cWhite)"/>
  </g>

  <!-- ── gold rings around the knobs: gold over the top, silver closing the bottom ──
       Radii track the real component sizes: RoundBlackKnob is 9.6mm across, the Huge
       (Coupling) is 18.2mm, so the rings sit ~1.5mm proud of each knob. -->
  <g fill="none" stroke="#e6a532" stroke-width="0.35" opacity="0.75" stroke-linecap="round">
    <path d="M2.7,28 A6.3,6.3 0 0 1 15.3,28"/>
    <path d="M66,28 A6.3,6.3 0 0 1 78.6,28"/>
    <path d="M34.34,26 A6.3,6.3 0 0 1 46.94,26"/>
    <path d="M18.7,40 A6.3,6.3 0 0 1 31.3,40"/>
    <path d="M50,40 A6.3,6.3 0 0 1 62.6,40"/>
    <path d="M5.7,62 A6.3,6.3 0 0 1 18.3,62"/>
    <path d="M63,62 A6.3,6.3 0 0 1 75.6,62"/>
    <path d="M30.04,72 A10.6,10.6 0 0 1 51.24,72"/>
  </g>
  <g fill="none" stroke="#aeb6c2" stroke-width="0.35" opacity="0.5" stroke-linecap="round">
    <path d="M2.7,28 A6.3,6.3 0 0 0 15.3,28"/>
    <path d="M66,28 A6.3,6.3 0 0 0 78.6,28"/>
    <path d="M34.34,26 A6.3,6.3 0 0 0 46.94,26"/>
    <path d="M18.7,40 A6.3,6.3 0 0 0 31.3,40"/>
    <path d="M50,40 A6.3,6.3 0 0 0 62.6,40"/>
    <path d="M5.7,62 A6.3,6.3 0 0 0 18.3,62"/>
    <path d="M63,62 A6.3,6.3 0 0 0 75.6,62"/>
    <path d="M30.04,72 A10.6,10.6 0 0 0 51.24,72"/>
  </g>

  <!-- ── dashed lines tying each CV jack to the control it feeds ── -->
  <g stroke="#e6a532" stroke-width="0.22" opacity="0.5" fill="none" stroke-dasharray="0.9 1.1">
    <path d="M25,19.4 L25,33.5"/>
    <path d="M56.3,19.4 L56.3,33.5"/>
    <path d="M9,37.6 L9,34.5"/>
    <path d="M72.3,37.6 L72.3,34.5"/>
    <path d="M12,73.6 L12,68.5"/>
    <path d="M69.3,73.6 L69.3,68.5"/>
    <path d="M40.64,90.0 L40.64,89.2"/>
  </g>

  <!-- Halfagiraf family identity. The internal Entwine slug remains stable. -->
  <text class="maker" x="40.64" y="2.5">halfagiraf</text>
  <text class="name" x="40.64" y="7.0">ENTWINE</text>
  <text class="tag"  x="40.64" y="10.2">AUTOREGRESSIVE VOICE</text>

  <!-- padlock mark above the Lock switch -->
  <g transform="translate(9,5.6)" fill="none" stroke="#dfe3ea" stroke-width="0.3">
    <rect x="-1.5" y="-0.4" width="3" height="2.4" rx="0.4" fill="#dfe3ea" stroke="none"/>
    <path d="M-0.9,-0.4 L-0.9,-1.3 A0.9,0.9 0 0 1 0.9,-1.3 L0.9,-0.4"/>
  </g>

  <text class="lbl" x="40.64" y="37.2">Scale</text>

  <text class="lbl" x="25"   y="48.5">Root</text>
  <text class="lbl" x="56.3" y="48.5">Glide</text>




  <text class="lbl" x="72.3" y="9.4">Lock</text>
  <text class="lbl" x="9"    y="49.5">Poly</text>
  <text class="lbl" x="72.3" y="49.5">Spread</text>

  <text class="lbl" x="12"   y="71.2">Wave</text>
  <text class="lbl" x="69.3" y="71.2">Env</text>



  <!-- Coupling cluster: paired recompute triggers, a contained activity
       light-pipe, then the primary CV input. -->
  <rect x="39.45" y="84.05" width="2.38" height="6.45" rx="1.19"
        fill="#080a0f" stroke="#35414c" stroke-width="0.18"/>
  <path d="M40.64,84.4 L40.64,90.05" stroke="#6ec8e5" stroke-width="0.75" opacity="0.12"/>

  <text class="lbl" x="40.64" y="104.3">Coupling</text>

  <!-- Trigger routing traces: each upper jack leads visually to its matching
       recompute button on the bottom row. Controls render over these paths. -->
  <g fill="none" stroke="#77828e" stroke-width="0.32" opacity="0.72"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M29.4,91.4 L29.4,105.7 L9,105.7 L9,108.1"/>
    <path d="M51.88,91.4 L51.88,105.7 L72.3,105.7 L72.3,108.1"/>
  </g>
  <g fill="#e6a532" opacity="0.72">
    <circle cx="9" cy="108.1" r="0.38"/>
    <circle cx="72.3" cy="108.1" r="0.38"/>
  </g>

  <text class="sml acc" x="9"    y="94.2">P V/OCT</text>
  <text class="sml acc" x="18.5" y="94.2">P GATE</text>
  <text class="sml acc" x="63"   y="94.2">Q V/OCT</text>
  <text class="sml acc" x="72.3" y="94.2">Q GATE</text>

  <rect x="8" y="107.5" width="65.28" height="0.35" fill="url(#rule)"/>
  <text class="lbl" x="9"    y="118.5">Reseed</text>
  <text class="lbl" x="72.3" y="118.5">Reseed</text>
  <text class="lbl acc" x="25"   y="118.5">Pulsar</text>
  <text class="lbl acc" x="56.3" y="118.5">Quasar</text>

  <!-- Halfagiraf signature, exactly the same scale as Bad Sector. -->
  <g transform="translate(28.5,123.0)">
    <path d="M-3.2,1.6 A3.4,3.4 0 0 1 3.2,1.6" fill="none" stroke="#c9d2dd" stroke-width="0.55" opacity="0.9"/>
    <path d="M-1.7,1.6 A1.8,1.8 0 0 1 1.7,1.6" fill="none" stroke="#c9d2dd" stroke-width="0.55" opacity="0.55"/>
    <circle cx="0" cy="1.6" r="0.42" fill="#c9d2dd"/>
  </g>
  <text class="brand" x="33.5" y="125.4">halfagiraf</text>
</svg>
