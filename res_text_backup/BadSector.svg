<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="71.12mm" height="128.5mm" viewBox="0 0 71.12 128.5">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131418"/>
      <stop offset="0.5" stop-color="#0b0c0f"/>
      <stop offset="1" stop-color="#0f1013"/>
    </linearGradient>
    <linearGradient id="drule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d2dd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9d2dd" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c9d2dd" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name { fill:#f2f4f7; font-family:'DejaVu Sans','Arial',sans-serif; font-size:3.8px; font-weight:400; letter-spacing:0.3px; text-anchor:middle; }
      .tag  { fill:#8c93a1; font-family:'DejaVu Sans','Arial',sans-serif; font-size:1.7px; font-weight:600; letter-spacing:0.55px; text-anchor:middle; }
      .lbl  { fill:#e8ecf2; font-family:'DejaVu Sans','Arial',sans-serif; font-size:2.5px; font-weight:400; text-anchor:middle; }
      .sml  { fill:#c2cad4; font-family:'DejaVu Sans','Arial',sans-serif; font-size:2.0px; font-weight:400; text-anchor:middle; }
      .sub  { fill:#767e8a; font-family:'DejaVu Sans','Arial',sans-serif; font-size:1.6px; font-weight:400; text-anchor:middle; }
      .out  { fill:#c9d2dd; }
      .brand{ fill:#8c93a1; font-family:'DejaVu Sans','Arial',sans-serif; font-size:2.2px; font-weight:700; letter-spacing:1.4px; text-anchor:start; }
    </style>
  </defs>

  <rect width="71.12" height="128.5" fill="url(#dbg)"/>
  <rect x="0.6" y="0.6" width="69.92" height="127.3" fill="none" stroke="#2b2e36" stroke-width="0.4"/>

  <!-- ── jumper-wire traces: the circuit-bending motif. Bend points wired from the Time knob
       up to the mode buttons, and from each knob down to the CV jack that modulates it. ── -->
  <g fill="none" stroke="#c9d2dd" stroke-width="0.32" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25.8,17.4 L34.0,17.4 L34.0,19.4 L38.4,19.4"/>
    <path d="M25.8,19.2 L32.0,19.2 L32.0,15.6 L50.0,15.6 L50.0,19.4"/>
    <path d="M25.8,21.0 L30.0,21.0 L30.0,13.8 L61.6,13.8 L61.6,19.4"/>
    <path d="M25.8,22.8 L31.0,22.8 L31.0,38.0 L29.0,38.0"/>
    <path d="M25.8,24.6 L33.0,24.6 L33.0,36.4 L40.0,36.4 L40.0,38.0"/>
    <path d="M24.0,30.4 L24.0,34.6 L51.0,34.6 L51.0,38.0"/>
    <path d="M20.0,30.4 L20.0,33.0 L62.0,33.0 L62.0,38.0"/>
  </g>
  <g fill="none" stroke="#c9d2dd" stroke-width="0.3" opacity="0.42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24.0,70.8 L24.0,78.0 L22.5,78.0 L22.5,83.8"/>
    <path d="M38.0,70.8 L38.0,78.0 L36.0,78.0 L36.0,83.8"/>
    <path d="M52.0,70.8 L52.0,78.0 L49.5,78.0 L49.5,83.8"/>
    <path d="M14.8,74.0 L18.5,74.0 L18.5,109.8 L22.5,109.8"/>
    <path d="M11.0,51.8 L11.0,56.0 L16.0,56.0 L16.0,109.8 L36.0,109.8"/>
    <path d="M16.5,30.4 L16.5,31.6 L13.0,31.6 L13.0,110.6 L49.5,110.6 L49.5,109.8"/>
  </g>
  <!-- solder points where the wires land -->
  <g fill="#c9d2dd" opacity="0.55">
    <circle cx="34.0" cy="17.4" r="0.35"/><circle cx="32.0" cy="15.6" r="0.35"/>
    <circle cx="30.0" cy="13.8" r="0.35"/><circle cx="31.0" cy="38.0" r="0.3"/>
    <circle cx="33.0" cy="36.4" r="0.3"/><circle cx="24.0" cy="34.6" r="0.3"/>
    <circle cx="20.0" cy="33.0" r="0.3"/><circle cx="18.5" cy="74.0" r="0.3"/>
    <circle cx="16.0" cy="56.0" r="0.3"/><circle cx="13.0" cy="31.6" r="0.3"/>
  </g>

  <text class="name" x="35.56" y="6.2">Bad Sector</text>

  <text class="lbl" x="16.5" y="33.5">time</text>

  <text class="sml" x="38.4" y="28.8">shift</text>
  <text class="sml" x="50.0" y="28.8">clock</text>
  <text class="sml" x="61.6" y="28.8">mode</text>

  <text class="sml" x="29.0" y="48.0">bend</text>
  <text class="sub" x="29.0" y="51.0">(stereo)</text>
  <text class="sml" x="40.0" y="48.0">break</text>
  <text class="sub" x="40.0" y="51.0">(default)</text>
  <text class="sml" x="51.0" y="48.0">corrupt</text>
  <text class="sub" x="51.0" y="51.0">(reset)</text>
  <text class="sml" x="62.0" y="48.0">freeze</text>
  <text class="sub" x="62.0" y="51.0">(latch)</text>

  <text class="lbl" x="11.0" y="55.5">repeats</text>
  <text class="lbl" x="10.0" y="82.5">mix</text>

  <text class="sml" x="24.0" y="74.5">bend</text>
  <text class="sml" x="38.0" y="74.5">break</text>
  <text class="sml" x="52.0" y="74.5">corrupt</text>

  <rect x="6" y="80.0" width="59.12" height="0.3" fill="url(#drule)"/>

  <text class="sml" x="8.5"  y="94.5">clock</text>
  <text class="sub" x="22.5" y="94.5">cv</text>
  <text class="sub" x="36.0" y="94.5">cv</text>
  <text class="sub" x="49.5" y="94.5">cv</text>
  <text class="sml" x="62.5" y="94.5">freeze</text>

  <text class="sml" x="8.5"  y="107.5">left</text>
  <text class="sub" x="22.5" y="107.5">gate</text>
  <text class="sub" x="36.0" y="107.5">gate</text>
  <text class="sub" x="49.5" y="107.5">gate</text>
  <text class="sml out" x="62.5" y="107.5">left</text>

  <text class="sml" x="8.5"  y="120.5">right</text>
  <text class="sml" x="22.5" y="120.5">mix</text>
  <text class="sml" x="36.0" y="120.5">repeats</text>
  <text class="sml" x="49.5" y="120.5">time</text>
  <text class="sml out" x="62.5" y="120.5">right</text>

  <!-- AR Synthesis arc mark + wordmark -->
  <g transform="translate(20.5,123.0)">
    <path d="M-3.2,1.6 A3.4,3.4 0 0 1 3.2,1.6" fill="none" stroke="#c9d2dd" stroke-width="0.55" opacity="0.9"/>
    <path d="M-1.7,1.6 A1.8,1.8 0 0 1 1.7,1.6" fill="none" stroke="#c9d2dd" stroke-width="0.55" opacity="0.55"/>
    <circle cx="0" cy="1.6" r="0.42" fill="#c9d2dd"/>
  </g>
  <text class="brand" x="25.5" y="125.4">halfagiraf</text>
</svg>
